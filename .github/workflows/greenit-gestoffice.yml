name: Audit GreenIT-Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code (fichiers de config dans greenit-audit/)
        uses: actions/checkout@v4

      - name: Préparer les dossiers input/output
        run: |
          mkdir -p greenit-audit/gestoffice/input greenit-audit/gestoffice/output
          chmod 755 greenit-audit/gestoffice/input
          chmod 777 greenit-audit/gestoffice/output

      - name: Attendre que Cloudflare Pages ait fini de déployer
        run: sleep 90

      - name: Générer login.yaml (avec les vrais identifiants, jamais commités)
        env:
          AUDIT_EMAIL: ${{ secrets.AUDIT_ACCOUNT_EMAIL }}
          AUDIT_PASSWORD: ${{ secrets.AUDIT_ACCOUNT_PASSWORD }}
        run: |
          cat > greenit-audit/gestoffice/input/login.yaml << EOF
          url: "https://gestoffices.nadybabs2023.workers.dev"
          fields:
            - selector: "#auth-email"
              value: "${AUDIT_EMAIL}"
            - selector: "#auth-password"
              value: "${AUDIT_PASSWORD}"
          loginButtonSelector: "button[onclick=\"handleSignIn()\"]"
          waitForSelector: ".role-pill"
          waitForTimeout: 7000
          EOF
          echo "--- Contenu généré (le mot de passe est automatiquement masqué par GitHub) ---"
          cat greenit-audit/gestoffice/input/login.yaml

      - name: Lancer GreenIT-Analysis (Docker, avec connexion réelle)
        run: |
          docker run --rm --cap-add=SYS_ADMIN \
            -v ${{ github.workspace }}/greenit-audit/gestoffice/input:/app/input \
            -v ${{ github.workspace }}/greenit-audit/gestoffice/output:/app/output \
            -e TZ=Europe/Paris \
            jpreisner/greenit-analysis-cli \
            greenit analyse /app/input/url.yaml /app/output/results.html --format=html --login=/app/input/login.yaml --ci

      - name: Sauvegarder le rapport (HTML + captures d'écran)
        uses: actions/upload-artifact@v4
        with:
          name: greenit-report
          path: greenit-audit/gestoffice/output/
          retention-days: 90
