name: Audit GreenIT-Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code (fichiers de config dans greenit-audit/)
        uses: actions/checkout@v4

      - name: Préparer les dossiers input/output
        run: |
          mkdir -p greenit-audit/gestoffice/input greenit-audit/gestoffice/output
          chmod 755 greenit-audit/gestoffice/input
          chmod 777 greenit-audit/gestoffice/output

      - name: Attendre que Cloudflare Pages ait fini de déployer
        run: sleep 90

      - name: Générer login.yaml à partir du modèle (avec les vrais identifiants, jamais commités)
        run: |
          sed \
            -e "s|__AUDIT_EMAIL__|${{ secrets.AUDIT_ACCOUNT_EMAIL }}|" \
            -e "s|__AUDIT_PASSWORD__|${{ secrets.AUDIT_ACCOUNT_PASSWORD }}|" \
            greenit-audit/gestoffice/input/login.yaml.template > greenit-audit/gestoffice/input/login.yaml

      - name: Lancer GreenIT-Analysis (Docker, avec connexion réelle)
        run: |
          docker run --rm --cap-add=SYS_ADMIN \
            -v ${{ github.workspace }}/greenit-audit/gestoffice/input:/app/input \
            -v ${{ github.workspace }}/greenit-audit/gestoffice/output:/app/output \
            -e TZ=Europe/Paris \
            jpreisner/greenit-analysis-cli \
            greenit analyse /app/input/url.yaml /app/output/results.html --format=html --login=/app/input/login.yaml --ci

      - name: Sauvegarder le rapport (HTML + captures d'écran)
        uses: actions/upload-artifact@v4
        with:
          name: greenit-report
          path: greenit-audit/gestoffice/output/
          retention-days: 90
