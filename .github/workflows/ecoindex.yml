name: Audit EcoIndex

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code (package.json, cypress.config.js, tests)
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances (Cypress + EcoIndex)
        working-directory: ecoindex-audit
        run: |
          cp package.audit.json package.json
          npm install

      - name: Autoriser Chrome à démarrer dans cet environnement (restriction noyau Ubuntu)
        run: |
          echo 'kernel.apparmor_restrict_unprivileged_userns=0' | sudo tee -a /etc/sysctl.d/60-apparmor-namespace.conf
          sudo sysctl --system

      - name: Attendre que Cloudflare Pages ait fini de déployer
        run: sleep 90

      - name: Récupérer un jeton de connexion pour le compte d'audit
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.AUDIT_ACCOUNT_EMAIL }}\",\"password\":\"${{ secrets.AUDIT_ACCOUNT_PASSWORD }}\"}")
          echo "CYPRESS_ACCESS_TOKEN=$(echo $RESPONSE | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).access_token')" >> $GITHUB_ENV
          echo "CYPRESS_REFRESH_TOKEN=$(echo $RESPONSE | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).refresh_token')" >> $GITHUB_ENV

      - name: Lancer l'audit EcoIndex (session authentifiée)
        working-directory: ecoindex-audit
        env:
          CYPRESS_TARGET_URL: https://gestoffices.nadybabs2023.workers.dev
        run: npx cypress run

      - name: Afficher le résultat dans les logs
        working-directory: ecoindex-audit
        run: cat ecoindex-report.json || echo "Rapport introuvable"

      - name: Sauvegarder le rapport
        uses: actions/upload-artifact@v4
        with:
          name: ecoindex-report
          path: ecoindex-audit/ecoindex-report.json
          retention-days: 90
